<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>위례 학군지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <div id="map" role="application" aria-label="위례 학군지도"></div>

  <header class="topbar">
    <div class="brand"><h1>위례 학군지도</h1><span class="badge-sample">샘플 데이터</span></div>
    <div class="chips" role="group" aria-label="표시할 정보">
      <button class="chip" id="t-zones" aria-pressed="true">영역</button>
      <button class="chip" id="t-pins" aria-pressed="true">아파트 시세</button>
      <button class="chip" id="t-schools" aria-pressed="true">학교</button>
      <button class="chip" id="t-lines" aria-pressed="true">호선·호재</button>
    </div>
    <div class="seg" id="gf" role="group" aria-label="학교 성별">
      <span class="seg-label">학교</span>
      <button data-v="all" aria-pressed="true">전체</button>
      <button data-v="남" aria-pressed="false">남</button>
      <button data-v="여" aria-pressed="false">여</button>
      <button data-v="공학" aria-pressed="false">공학</button>
    </div>
  </header>

  <details class="legend" open>
    <summary>범례</summary>
    <ul>
      <li><span class="sw" style="background:var(--north)"></span>북위례</li>
      <li><span class="sw" style="background:var(--south)"></span>남위례</li>
      <li><span class="sw" style="background:var(--leader)"></span>★ 영역 대장 아파트</li>
      <li><span class="sw" style="background:var(--male);border-radius:50%"></span>남학교 <span class="sw" style="background:var(--female);border-radius:50%"></span>여학교 <span class="sw" style="background:var(--coed);border-radius:50%"></span>공학</li>
      <li><span class="sw line" style="border-color:var(--fg)"></span>운행 노선</li>
      <li><span class="sw line dash" style="border-color:var(--fg)"></span>공사중·계획 노선</li>
    </ul>
  </details>
  <div class="hint">확대하면 하천·소로·단지 블록이 나타납니다</div>

  <aside class="panel" id="panel" hidden aria-label="상세 정보">
    <div class="panel-head">
      <div class="titles"><div class="eyebrow" id="panel-eyebrow"></div><h2 id="panel-title"></h2></div>
      <button class="x" id="panel-close" aria-label="닫기">×</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
