name: collect-data
on:
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 (KST)
  workflow_dispatch:
    inputs:
      months:
        description: '실거래 수집 개월 수 (기본 60)'
        default: '60'
      master:
        description: '전체 아파트 마스터 구축 포함 (무거움, 처음 한 번 true)'
        type: boolean
        default: false
      reference:
        description: '대학·학과 마스터 구축 포함 (월 1회)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: collect-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node pipeline/make_inputs.js
      - id: collect
        continue-on-error: true
        run: python3 pipeline/run_all.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          MONTHS: ${{ inputs.months || '60' }}
          RUN_MASTER: ${{ inputs.master && '1' || '0' }}
          RUN_REFERENCE: ${{ inputs.reference && '1' || '0' }}
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "eodisalji-bot"
          git config user.email "eodisalji-bot@users.noreply.github.com"
          git add schoolmap/real-data.js pipeline/out/molit_result.json pipeline/out/kakao_neis_result.json pipeline/out/api_samples.json pipeline/out/schools_all.json pipeline/out/quality_report.json pipeline/out/quality_report.md pipeline/out/master.json.gz pipeline/out/geo_cache.json pipeline/out/reference.json.gz pipeline/out/university_report.json pipeline/out/zone_links_seoul.json.gz data/university_master.csv data/major_master.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: update public data" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
      - name: 수집 단계 실패 여부 표시
        if: steps.collect.outcome == 'failure'
        run: |
          echo "일부 단계가 실패했습니다. 위 collect 단계 로그에서 '실패한 단계'를 확인하세요."; exit 1
