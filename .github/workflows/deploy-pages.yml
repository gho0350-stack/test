name: deploy-pages
on:
  push:
    branches: [claude/claude-settings-config-od8zs3]
    paths: ['schoolmap/**']
  workflow_run:
    workflows: [collect-data]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 구성 (카카오 JavaScript 키 주입)
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
        run: |
          mkdir _site && cp -r schoolmap/. _site/
          printf 'window.SG_CONFIG = { kakaoJsKey: "%s" };\n' "$KAKAO_JS_KEY" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
